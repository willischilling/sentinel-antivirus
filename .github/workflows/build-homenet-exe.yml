name: Build Home Network Manager (.exe)

# Builds the standalone Home Network Manager app on a cloud Windows machine as a
# one-FOLDER app (exe + its files), which is robust against antivirus
# false-positives and does not unpack to a temp folder at launch. The result is
# zipped and published to the dist-exe branch so it can be fetched over git.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/epic-albattani-zpmehu
    paths:
      - 'homenet-manager/**'
      - '.github/workflows/build-homenet-exe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and dependency
        working-directory: homenet-manager
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller psutil

      - name: Build (one folder, with icon)
        working-directory: homenet-manager
        run: python -m PyInstaller --noconsole --name HomeNetManager --icon assets/icon.ico "--add-data=assets/icon.ico;assets" main.py

      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path homenet-manager/dist/HomeNetManager -DestinationPath HomeNetManager.zip -Force

      - name: Upload the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeNetManager
          path: HomeNetManager.zip
          if-no-files-found: error

      - name: Publish the zip to the dist-exe branch
        shell: bash
        run: |
          git checkout --orphan dist-exe
          git reset
          git add -f HomeNetManager.zip
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              commit -m "Built HomeNetManager (one-folder) zip"
          git push -f origin dist-exe
