<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sentinel Browser</title>
<style>
:root {
  --bg: #0b1120; --panel: #0f172a; --card: #151f33; --hover: #1b2842; --line: #24324d;
  --text: #e7ecf5; --muted: #8b97ad; --accent: #3b82f6; --good: #22c55e; --warn: #f59e0b; --bad: #ef4444;
  --private: #a78bfa;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--panel); color: var(--text);
  font: 13px "Segoe UI Variable Text", "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* tab strip */
.strip { height: 38px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px 0 8px; }
.tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
.tab { height: 32px; min-width: 60px; width: 220px; flex: 0 1 220px; display: flex; align-items: center; gap: 8px;
  padding: 0 8px 0 12px; border-radius: 9px 9px 0 0; color: var(--muted); cursor: default; position: relative; }
.tab:hover { background: var(--hover); color: var(--text); }
.tab.active { background: var(--card); color: var(--text); }
.tab .ico { width: 16px; height: 16px; border-radius: 3px; flex: none; display: grid; place-items: center; }
.tab .ico img { width: 16px; height: 16px; }
.tab .ico .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.tab .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab .x { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; opacity: .75; }
.tab .x:hover { background: var(--line); opacity: 1; }
.tab .x svg { width: 12px; height: 12px; }
.tab.blocked .title { color: var(--bad); }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.newtab { width: 30px; height: 30px; margin-bottom: 1px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
.newtab:hover { background: var(--hover); color: var(--text); }
.private { margin-left: auto; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; color: var(--private);
  font-weight: 600; font-size: 11.5px; letter-spacing: .06em; padding: 3px 10px; border-radius: 99px;
  background: color-mix(in srgb, var(--private) 14%, transparent); flex: none; }
.private svg { width: 14px; height: 14px; }

/* toolbar */
.bar { height: 44px; background: var(--card); display: flex; align-items: center; gap: 4px; padding: 0 8px;
  border-bottom: 1px solid var(--line); }
.btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--text); position: relative; flex: none; }
.btn:hover { background: var(--hover); }
.btn.off { color: var(--line); pointer-events: none; }
.btn.on { background: var(--hover); }
.badge { position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px;
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.badge.good { background: var(--good); color: #0b1120; }
.badge[hidden] { display: none; }
.address { flex: 1; height: 32px; margin: 0 6px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 99px; min-width: 0; }
.address:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.address .state { display: flex; align-items: center; gap: 6px; color: var(--good); flex: none; font-size: 12px; font-weight: 600; }
.address .state.caution { color: var(--warn); } .address .state.blocked { color: var(--bad); } .address .state.plain { color: var(--muted); }
.address input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 13.5px; user-select: text; -webkit-user-select: text; }
.address input::placeholder { color: var(--muted); }
.shield { width: auto; padding: 0 10px 0 8px; gap: 6px; display: flex; align-items: center; font-weight: 600; font-size: 12px; color: var(--good); }
.shield img { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="strip">
  <div class="tabs" id="tabs"></div>
  <div class="newtab" id="newtab" title=""><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
  <div class="private" id="private"><svg viewBox="0 0 24 24"><path d="M3 11c3-4 15-4 18 0M6 11l1 7h3l2-3 2 3h3l1-7"/></svg><span id="private-text">PRIVATE</span></div>
</div>
<div class="bar">
  <div class="btn" id="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="btn" id="forward"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
  <div class="btn" id="reload"><svg viewBox="0 0 24 24" id="reload-icon"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></div>
  <div class="btn" id="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></div>
  <div class="address">
    <div class="state" id="state"></div>
    <input id="url" spellcheck="false" autocomplete="off">
  </div>
  <div class="btn shield" id="shield"><img src="shield.png" alt=""><span id="shield-count">0</span></div>
  <div class="btn" id="downloads"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg><span class="badge" id="dl-badge" hidden></span></div>
  <div class="btn" id="menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></div>
</div>
<script>
const $ = id => document.getElementById(id);
const send = msg => chrome.webview.postMessage(JSON.stringify(msg));
let T = {}, S = null, shownTab = null;
const ICONS = {
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h0"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h0"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  reload: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
  cross: '<path d="M6 6l12 12M18 6L6 18"/>',
};

function renderTabs() {
  const box = $("tabs"); box.innerHTML = "";
  for (const tab of S.tabs) {
    const el = document.createElement("div");
    el.className = "tab" + (tab.id === S.active ? " active" : "") + (tab.verdict === "blocked" ? " blocked" : "");
    el.title = tab.title;
    const ico = document.createElement("div"); ico.className = "ico";
    if (tab.loading) ico.innerHTML = '<div class="spin"></div>';
    else if (tab.verdict === "blocked") ico.innerHTML = ICONS.stop.replace("<svg", '<svg style="color:var(--bad)"');
    else if (tab.favicon) { const img = document.createElement("img"); img.src = tab.favicon; img.onerror = () => ico.innerHTML = '<div class="dot"></div>'; ico.append(img); }
    else ico.innerHTML = '<div class="dot"></div>';
    const title = document.createElement("div"); title.className = "title"; title.textContent = tab.title;
    const x = document.createElement("div"); x.className = "x"; x.innerHTML = ICONS.x; x.title = T.brw_close_tab || "";
    x.onclick = e => { e.stopPropagation(); send({cmd: "close_tab", id: tab.id}); };
    el.append(ico, title, x);
    el.onmousedown = e => { if (e.button === 1) { e.preventDefault(); send({cmd: "close_tab", id: tab.id}); } };
    el.onclick = () => send({cmd: "activate", id: tab.id});
    box.append(el);
  }
}

function renderBar() {
  $("back").classList.toggle("off", !S.can_back);
  $("forward").classList.toggle("off", !S.can_forward);
  $("reload-icon").innerHTML = S.loading ? ICONS.cross : ICONS.reload;
  $("reload").title = S.loading ? (T.brw_stop || "") : (T.brw_reload || "");
  if (document.activeElement !== $("url") || S.active !== shownTab) $("url").value = S.url;
  shownTab = S.active;
  const st = $("state");
  if (S.sentinel_page) { st.className = "state plain"; st.innerHTML = ICONS.info; st.title = ""; }
  else if (S.verdict === "blocked") { st.className = "state blocked"; st.innerHTML = ICONS.stop + (T.brw_blocked_short || ""); }
  else if (S.verdict === "caution") { st.className = "state caution"; st.innerHTML = ICONS.warn; st.title = S.reason; }
  else if (S.secure) { st.className = "state"; st.innerHTML = ICONS.lock; st.title = T.brw_secure || ""; }
  else { st.className = "state caution"; st.innerHTML = ICONS.warn; st.title = T.brw_not_secure || ""; }
  $("shield-count").textContent = S.opts.block_trackers ? S.trackers : "off";
  $("shield").style.color = S.opts.block_trackers ? "" : "var(--muted)";
  const badge = $("dl-badge");
  badge.hidden = !S.downloading;
  badge.textContent = S.downloading;
  for (const kind of ["shield", "downloads", "menu"]) $(kind).classList.toggle("on", false);
}

chrome.webview.addEventListener("message", e => {
  const msg = e.data;
  if (msg.type === "strings") {
    T = msg.strings;
    $("url").placeholder = T.brw_address;
    $("private-text").textContent = T.brw_private_badge;
    $("private").title = T.brw_private_tip;
    for (const [id, key] of [["newtab", "brw_new_tab"], ["back", "brw_back"], ["forward", "brw_forward"],
                             ["home", "brw_home"], ["shield", "brw_shield_tip"], ["downloads", "brw_downloads"],
                             ["menu", "brw_menu"]]) $(id).title = T[key];
  } else if (msg.type === "state") {
    S = msg; renderTabs(); renderBar();
  } else if (msg.type === "focus") {
    $("url").focus(); $("url").select();
  }
});

$("newtab").onclick = () => send({cmd: "new_tab"});
$("back").onclick = () => send({cmd: "back"});
$("forward").onclick = () => send({cmd: "forward"});
$("reload").onclick = () => send({cmd: S && S.loading ? "stop" : "reload"});
$("home").onclick = () => send({cmd: "home"});
for (const kind of ["shield", "downloads", "menu"]) {
  $(kind === "shield" ? "shield" : kind).onclick = () => {
    const r = $(kind).getBoundingClientRect();
    send({cmd: "panel", kind, rect: {left: r.left, right: r.right, bottom: r.bottom}});
  };
}
$("url").addEventListener("focus", () => setTimeout(() => $("url").select(), 0));
$("url").addEventListener("keydown", e => {
  if (e.key === "Enter") { send({cmd: "navigate", text: $("url").value}); $("url").blur(); }
  if (e.key === "Escape") { $("url").value = S ? S.url : ""; $("url").blur(); }
});
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key.toLowerCase() === "t") { e.preventDefault(); send({cmd: "new_tab"}); }
  else if (e.ctrlKey && e.key.toLowerCase() === "w") { e.preventDefault(); send({cmd: "close_tab", id: S && S.active}); }
  else if (e.ctrlKey && e.key === "Tab") { e.preventDefault(); send({cmd: "cycle", step: e.shiftKey ? -1 : 1}); }
  else if (e.ctrlKey && e.key.toLowerCase() === "l") { e.preventDefault(); $("url").focus(); }
});
document.addEventListener("contextmenu", e => { if (e.target !== $("url")) e.preventDefault(); });
send({cmd: "ready"});
</script>
</body>
</html>
